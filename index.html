<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Livros-Jogos Interativos</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main>
    <header>
      <div class="muted">Biblioteca de Livros-Jogos Interativos</div>
      <h1 id="game-title">Carregando…</h1>
      <p id="game-status" class="muted"></p>
    </header>

    <section id="setup" class="card">
      <h2>Nova partida</h2>

      <p><strong>Modo</strong></p>
      <div class="grid">
        <button data-mode="solo">👤 Solo</button>
        <button data-mode="dupla">👥 Dois jogadores</button>
      </div>

      <p style="margin-top:18px"><strong>Personagem</strong></p>
      <div class="grid">
        <button data-character="colthar">⚔️ Colthar<br><span class="muted">Príncipe-Guerreiro</span></button>
        <button data-character="lothar">🪄 Lothar<br><span class="muted">Príncipe-Feiticeiro</span></button>
      </div>

      <button id="start" class="primary" style="margin-top:18px">🎲 Gerar ficha e começar</button>
      <p id="message" class="muted" style="margin-top:10px"></p>
    </section>

    <section id="game" class="hidden">
      <div class="card">
        <div id="stats" class="stats"></div>
        <p id="shared" class="muted" style="margin-top:12px"></p>
      </div>

      <div class="card">
        <div id="reference" class="muted"></div>
        <h2 style="margin-top:8px">Cena</h2>
        <p id="scene"></p>
        <div id="choices" class="grid"></div>
      </div>
    </section>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
