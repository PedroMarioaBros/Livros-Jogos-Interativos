name: Gerar APK Android de debug

on:
  pull_request:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "tools/build-web.mjs"
      - "assets/**"
      - "src/**"
      - "jogos/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências Capacitor
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Gerar pacote web
        run: npm run build:web

      - name: Gerar projeto Android
        run: npx cap add android

      - name: Sincronizar projeto Android
        run: npx cap sync android

      - name: Compilar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Confirmar APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: livros-jogos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
