name: Gerar APK Android de debug

on:
  pull_request:
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "tools/build-web.mjs"
      - "tools/android-emulator-smoke.py"
      - "assets/**"
      - "src/**"
      - "jogos/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Aceitar licenças do Android SDK
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Instalar SDK Android 36
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependências Capacitor
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Gerar pacote web
        run: npm run build:web

      - name: Gerar projeto Android
        run: npx cap add android

      - name: Gerar ícones e splash nativos Android
        run: npm run android:assets

      - name: Auditar assets nativos Android
        run: npm run android:native-assets-audit

      - name: Sincronizar projeto Android
        run: npx cap sync android

      - name: Compilar APK de debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Confirmar APK
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - name: Verificar assinatura do APK
        run: /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/debug/app-debug.apk

      - name: Validar metadados do APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="android/app/build/outputs/apk/debug/app-debug.badging.txt"
          AAPT="/usr/local/lib/android/sdk/build-tools/36.0.0/aapt"

          "$AAPT" dump badging "$APK" | tee "$OUT"
          grep -F "package: name='io.github.pedromariabros.livrosjogos'" "$OUT"
          grep -F "sdkVersion:'24'" "$OUT"
          grep -F "targetSdkVersion:'36'" "$OUT"
          grep -F "launchable-activity:" "$OUT"

      - name: Gerar checksum SHA-256
        working-directory: android/app/build/outputs/apk/debug
        run: sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Gerar APK de atualização
        run: |
          set -euo pipefail
          OUT="android/app/build/outputs/apk/debug"
          CI_OUT="android/app/build/ci-apks"
          GRADLE="android/app/build.gradle"
          AAPT="/usr/local/lib/android/sdk/build-tools/36.0.0/aapt"
          APKSIGNER="/usr/local/lib/android/sdk/build-tools/36.0.0/apksigner"

          mkdir -p "$CI_OUT"
          cp "$OUT/app-debug.apk" "$CI_OUT/app-debug-v1.apk"
          cp "$OUT/app-debug.badging.txt" "$CI_OUT/app-debug-v1.badging.txt"
          sha256sum "$CI_OUT/app-debug-v1.apk" > "$CI_OUT/app-debug-v1.apk.sha256"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")

          updated, count_code = re.subn(
              r"\bversionCode\s+1\b",
              "versionCode 2",
              text,
              count=1,
          )
          updated, count_name = re.subn(
              r'\bversionName\s+"1\.0"',
              'versionName "1.0.1"',
              updated,
              count=1,
          )

          if count_code != 1 or count_name != 1:
              raise SystemExit(
                  f"Falha ao preparar versão de atualização: "
                  f"versionCode={count_code}, versionName={count_name}"
              )

          path.write_text(updated, encoding="utf-8")
          PY

          (cd android && ./gradlew assembleDebug --stacktrace)

          "$APKSIGNER" verify --verbose "$OUT/app-debug.apk"
          "$AAPT" dump badging "$OUT/app-debug.apk" | tee "$OUT/app-debug.badging.txt"
          grep -F "package: name='io.github.pedromariabros.livrosjogos' versionCode='2' versionName='1.0.1'" "$OUT/app-debug.badging.txt"
          grep -F "sdkVersion:'24'" "$OUT/app-debug.badging.txt"
          grep -F "targetSdkVersion:'36'" "$OUT/app-debug.badging.txt"

          cp "$OUT/app-debug.apk" "$CI_OUT/app-debug-v2.apk"
          cp "$OUT/app-debug.badging.txt" "$CI_OUT/app-debug-v2.badging.txt"
          sha256sum "$OUT/app-debug.apk" > "$OUT/app-debug.apk.sha256"
          sha256sum "$CI_OUT/app-debug-v2.apk" > "$CI_OUT/app-debug-v2.apk.sha256"

      - name: Habilitar KVM para emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar e abrir APK no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 tools/android-emulator-smoke.py

      - name: Publicar APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: livros-jogos-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
            android/app/build/outputs/apk/debug/app-debug.badging.txt
            android/app/build/ci-apks/app-debug-v1.apk
            android/app/build/ci-apks/app-debug-v1.apk.sha256
            android/app/build/ci-apks/app-debug-v1.badging.txt
            android/app/build/ci-apks/app-debug-v2.apk
            android/app/build/ci-apks/app-debug-v2.apk.sha256
            android/app/build/ci-apks/app-debug-v2.badging.txt
            android/app/build/outputs/apk/debug/emulator-*.png
            android/app/build/outputs/apk/debug/emulator-*.xml
          if-no-files-found: error
          retention-days: 14
